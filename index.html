    <title>Project Nuraya — PT Nuraya Digital Nusantara</title>
    <script>
      // Apply the stored theme before first paint. Without this the page would
      // flash light before React mounts, and the prerendered markup (which is
      // always generated in light mode) would disagree with what the user sees.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* private mode or storage disabled — fall back to light */
        }
      })()
    </script>
  </head>
